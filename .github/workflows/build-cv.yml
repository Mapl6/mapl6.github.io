name: Build CV PDF

on:
  push:
    branches: [main]
    paths:
      - "cv/**/*.tex"
      - ".github/workflows/build-cv.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          # mahdicv.tex = designed CV, mahdi-amoozadeh-cv.tex = plain CV for job portals
          root_file: |
            mahdicv.tex
            mahdi-amoozadeh-cv.tex
          working_directory: cv
          # fontawesome5, tcolorbox, cfr-lm need a full TeX Live
          scheme: full

      - name: Place PDFs in repo root
        run: cp cv/mahdicv.pdf cv/mahdi-amoozadeh-cv.pdf .

      - name: Commit PDF
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: rebuild CV PDFs"
          file_pattern: mahdicv.pdf mahdi-amoozadeh-cv.pdf
