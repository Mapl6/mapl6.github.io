function editDistance(a, b) {
    const dp = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
    for (let j = 1; j <= b.length; j++) dp[0][j] = j;
    for (let i = 1; i <= a.length; i++)
        for (let j = 1; j <= b.length; j++)
            dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    return dp[a.length][b.length];
}

            window.open(profile.cv, '_blank', 'noopener');
            return [
                span('success', '✓ Opening CV in a new tab…'),
                `If nothing opened, ${link(profile.cv, 'click here to download mahdicv.pdf')}.`,
            ];
        },
    },
    open: {
        desc: 'Open a link — github | linkedin | email | cv',
        args: () => ['github', 'linkedin', 'email', 'cv'],
        run([target]) {
            const targets = { github: profile.github, linkedin: profile.linkedin, email: 'mailto:' + profile.email, cv: profile.cv };
            const url = targets[target];
            if (!url) return [span('error', 'Usage: open <github|linkedin|email|cv>')];
            if (url.startsWith('mailto:')) window.location.href = url;
            else window.open(url, '_blank', 'noopener');
            return [span('success', `✓ Opening ${target}…`)];
        },
    },
    theme: {
        desc: 'Switch theme — theme [light|dark]',
        args: () => ['light', 'dark'],
        run([name]) {
            const next = name === 'light' || name === 'dark' ? name : (theme.current() === 'light' ? 'dark' : 'light');
            theme.set(next);
            return [span('success', `✓ Theme set to ${next}`)];
        },
    },
    history: {
        desc: 'Commands you have run',
        run() {
            if (!state.history.length) return [span('muted', 'No commands yet.')];
            return state.history.map((c, i) => `${span('muted', String(i + 1).padStart(3))}  ${esc(c)}`);
        },
    },
    clear: {
        desc: 'Clear the screen',
        run() { clearScreen(); },
    },
    // Hidden extras
    whoami: { hidden: true, run: () => [`${esc(profile.name)} — ${esc(profile.title)}`] },
    cv: { hidden: true, run: () => commands.resume.run([]) },
    ls: { hidden: true, run: () => [['about', 'experience', 'projects', 'skills', 'education', 'contact'].map((c) => cmd(c, c + '.txt')).join('  ') + '  ' + link(profile.cv, 'mahdicv.pdf')] },
    date: { hidden: true, run: () => [esc(new Date().toString())] },
    echo: { hidden: true, run: (args) => [esc(args.join(' '))] },
    sudo: { hidden: true, run: () => [span('error', 'visitor is not in the sudoers file. This incident will be reported. 😄')] },
    banner: { hidden: true, run: () => [`<div class="ascii" aria-hidden="true">${esc(banner)}</div>`] },
};

// ================= Terminal =================
const output = $('#output');
const screen = $('#screen');
const input = $('#cmd');
const state = { history: [], historyIndex: 0, printing: false, skip: false, queue: Promise.resolve() };

function scrollToBottom() { screen.scrollTop = screen.scrollHeight; }

// Queued so it runs after any output still being printed
function clearScreen() { state.queue = state.queue.then(() => { output.innerHTML = ''; }); }

function print(lines, { delay = 18 } = {}) {
    state.queue = state.queue.then(async () => {
        state.printing = true;
        for (const html of lines) {
            const div = document.createElement('div');
            div.className = 'line';
            div.innerHTML = html;
            output.appendChild(div);
            scrollToBottom();
            if (delay && !state.skip && !reducedMotion) await sleep(delay);
        }
        state.printing = false;
        state.skip = false;
    });
    return state.queue;
}

function suggest(name) {
    let best = null, bestScore = 3;
    for (const candidate of Object.keys(commands)) {
        const score = editDistance(name, candidate);
        if (score < bestScore) { best = candidate; bestScore = score; }
    }
    return best;
}

function run(raw) {
    const text = raw.trim();
    print([`<span class="prompt">visitor@mahdi<span class="path">:~$</span></span> <span class="echo">${esc(text)}</span>`], { delay: 0 });
    if (!text) return;

    state.history.push(text);
    state.historyIndex = state.history.length;

    const [name, ...args] = text.split(/\s+/);
    const command = commands[name.toLowerCase()];
    if (command) {
        const result = command.run(args.map((a) => a.toLowerCase()));
        if (result && result.length) print([...result, '']);
        return;
    }
    const guess = suggest(name.toLowerCase());
    print([
        span('error', `command not found: ${name}`),
        guess ? `Did you mean ${cmd(guess)}? Type ${cmd('help')} for all commands.` : `Type ${cmd('help')} for all commands.`,
        '',
    ], { delay: 0 });
}

function complete() {
    const value = input.value.replace(/^\s+/, '');
    const parts = value.split(/\s+/);
    let options, prefix;
    if (parts.length === 1) {
        prefix = parts[0].toLowerCase();
        options = Object.keys(commands).filter((c) => !commands[c].hidden && c.startsWith(prefix)).map((c) => c + ' ');
    } else {
        const command = commands[parts[0].toLowerCase()];
        prefix = parts[parts.length - 1].toLowerCase();
        const base = parts.slice(0, -1).join(' ') + ' ';
        options = command && command.args ? command.args().filter((a) => a.startsWith(prefix)).map((a) => base + a) : [];
    }
    if (options.length === 1) {
        input.value = options[0];
    } else if (options.length > 1) {
        print([span('muted', options.map((o) => o.trim().split(' ').pop()).join('   '))], { delay: 0 });
    }
}

input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
        if (state.printing) state.skip = true;
        run(input.value);
        input.value = '';
    } else if (e.key === 'Tab') {
        e.preventDefault();
        complete();
    } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (state.historyIndex > 0) input.value = state.history[--state.historyIndex];
    } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        state.historyIndex = Math.min(state.historyIndex + 1, state.history.length);
        input.value = state.history[state.historyIndex] || '';
    } else if (e.key === 'l' && e.ctrlKey) {
        e.preventDefault();
        clearScreen();
    } else if (e.key === 'c' && e.ctrlKey && !window.getSelection().toString()) {
        print([`<span class="prompt">visitor@mahdi<span class="path">:~$</span></span> <span class="echo">${esc(input.value)}</span>^C`], { delay: 0 });
        input.value = '';
    } else if (state.printing) {
        state.skip = true;
    }
});

// Clickable commands inside output
output.addEventListener('click', (e) => {
    const button = e.target.closest('[data-cmd]');
    if (!button) return;
    if (state.printing) state.skip = true;
    run(button.dataset.cmd);
    input.focus({ preventScroll: true });
});

// Click anywhere on the screen focuses the prompt (unless selecting text or clicking a link)
screen.addEventListener('mouseup', (e) => {
    if (e.target.closest('a, button') || window.getSelection().toString()) return;
    input.focus({ preventScroll: true });
});

// Quick command bar
const quick = ['about', 'experience', 'projects', 'skills', 'contact', 'resume', 'help'];
const quickbar = $('#quickbar');
quick.forEach((name) => {
    const chip = document.createElement('button');
    chip.className = 'chip' + (name === 'resume' ? ' primary' : '');
    chip.textContent = name === 'resume' ? '↓ resume' : name;
    chip.addEventListener('click', () => {
        if (state.printing) state.skip = true;
        run(name);
    });
    quickbar.appendChild(chip);
});

// Window controls
const terminal = $('#terminal');
const reopen = $('#reopen');
$('#btn-close').addEventListener('click', () => {
    terminal.classList.add('closed');
    reopen.classList.add('visible');
    reopen.focus();
});
reopen.addEventListener('click', () => {
    terminal.classList.remove('closed', 'minimized');
    reopen.classList.remove('visible');
    input.focus();
});
$('#btn-min').addEventListener('click', () => terminal.classList.toggle('minimized'));
$('#btn-max').addEventListener('click', () => terminal.classList.toggle('maximized'));
$('#btn-theme').addEventListener('click', () => run('theme'));

// Clock
const clock = $('#clock');
const tick = () => { clock.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); };
tick();
setInterval(tick, 30000);

// Boot
theme.init();
print([
    `<div class="ascii" aria-hidden="true">${esc(banner)}</div>`,
    `Welcome! I'm ${span('strong', profile.name)}, a ${span('accent', profile.title)}.`,
    `Type ${cmd('help')} to see all commands, or start with ${cmd('about')}, ${cmd('projects')} or ${cmd('resume')}.`,
    '',
], { delay: 40 });
if (window.matchMedia('(pointer: fine)').matches) input.focus();
    </script>
</body>
